# Keyword rules for general calendars (libraries, towns, news sites) that
# list every kind of event. Only events whose title (or description) matches
# a category below are kept, and that category is assigned. Patterns are
# regular expressions matched case-insensitively on whole words. They are
# deliberately specific: "train" alone would pull in every bus-and-train trip
# and book club, so we look for phrases like "model train" or "train show".

categories:
  trains:
    - (model|toy|holiday|garden|miniature) trains?
    - trains? (show|display|layout|meet|exhibit|expo|sale)
    - model railroad\w*
    - railroad (museum|history|club|show|display|heritage)
    - railway (museum|history|society)
    - garden railway
    - LIRR history
    - lionel
    - locomotives?
    - trolley museum
    - railfans?
    - HO scale
    - O gauge
    - steam (train|locomotive|engine)
  ham-radio:
    - ham radio
    - amateur radio
    - hamfests?
    - ARRL
    - radio club
    - field day
    - morse code
    - shortwave
    - VE (test|exam)\w*
    - radio license
  computers:
    - vintage computers?
    - retro ?computing
    - retro ?gaming
    - (computer|video ?game|gaming|game|electronics|tech) (history|museum|show|festival|expo|swap|swap meet|flea market|convention|con)s?
    - computer festivals?
    - swap ?meets?
    - (electronics|computer|tech) (flea|swap|sale)
    - retro (game|games|gaming|video games?|console|arcade)\w*
    - classic (video )?games?
    - video ?game (tournament|night|swap|expo|convention)s?
    - (nintendo|sega|super nintendo|NES|SNES|famicom|game boy|playstation|pac-?man|donkey kong)
    - pinball
    - commodore
    - atari
    - arcades?
    - LAN party
    - (8|16)-?bit
    - chiptunes?
    - raspberry pi
    - arduino
    - hackathon
  museum:
    - planetarium
    - astronomy
    - telescopes?
    - star party
    - space (shuttle|flight|exploration|history)
    - aviation history
    - aircraft
    - tesla
    - science (museum|center)
    # Government and lab open houses, only when about science or tech.
    - (lab|laboratory|observatory|weather service|NOAA|coast guard|air (national )?guard|air station|power plant|water (treatment|pollution control)|radio station|fire ?boat) (open house|tours?|day)
    - open house at (the )?(lab|laboratory|observatory|weather|NOAA|coast guard|air station|planetarium)
    - Brookhaven (National )?Lab\w*
    - BNL
    - summer sundays
    - lighthouse (tours?|open house|climb)
    - (aviation|air) (show|day)s?

# Matching titles are dropped even if they matched above: kids' crafts,
# day trips, classes for beginners, and other false friends.
exclude:
  - grades?
  - tweens?
  - teens?
  - toddlers?
  - preschool
  - storytime
  - months
  - craft
  - (bus|day) trip
  - trip to
  - book club
  - underground railroad
  - computer (basics|classes|class|cleanup)
  - beginners?
  - board games?
  - bingo
