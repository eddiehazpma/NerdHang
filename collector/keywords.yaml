# Keyword rules for general calendars (libraries, towns, news sites) that
# list every kind of event. Only events whose title (or description) matches
# a category below are kept, and that category is assigned. Patterns are
# regular expressions matched case-insensitively on whole words. They are
# deliberately specific: "train" alone would pull in every bus-and-train trip
# and book club, so we look for phrases like "model train" or "train show".

categories:
  trains:
    - (model|toy|holiday|garden|miniature) trains?
    - trains? (show|display|layout|meet|exhibit|expo|sale)
    - model railroad\w*
    - railroad (museum|history|club|show|display|heritage)
    - railway (museum|history|society)
    - garden railway
    - LIRR history
    - lionel
    - locomotives?
    - trolley museum
    - railfans?
    - HO scale
    - O gauge
    - steam (train|locomotive|engine)
    - (polar express|santa('s)? (train|express)|north pole express)
    - (rail|train) (excursion|ride|tour)s?
    - excursion trains?
    - (rail|train)road (excursion|ride|tour)s?
  ham-radio:
    - ham radio
    - amateur radio
    - hamfests?
    - ARRL
    - radio club
    - field day
    - morse code
    - shortwave
    - VE (test|exam)\w*
    - radio license
  computers:
    - vintage computers?
    - retro ?computing
    - retro ?gaming
    - (computer|video ?game|gaming|game|electronics|tech) (history|museum|show|festival|expo|swap|swap meet|flea market|convention|con)s?
    - computer festivals?
    - swap ?meets?
    - (electronics|computer|tech) (flea|swap|sale)
    - retro (game|games|gaming|video games?|console|arcade)\w*
    - classic (video games?|arcade|consoles?)
    - video ?game (swap|expo|convention)s?
    - (NES|SNES|famicom|sega genesis|atari 2600|pac-?man)
    - pinball
    - commodore
    - atari
    - arcades?
    - LAN party
    - (8|16)-?bit
    - chiptunes?
    - raspberry pi
    - arduino
    - hackathon
  makers:
    - makers?(space| ?faire| ?fair| ?night| ?meetup|s? club)
    - hacker ?spaces?
    - hackers?
    - 2600 (meeting|meetup)s?
    - lock ?picking
    - (3-?D|three-?D) print\w*
    - laser cut\w*
    - soldering
    - robotics?
    - (model|scale) (ship|boat|airplane|aircraft|rocket|car|kit)s?( building)?
    - ship ?models?
    - model (building|makers|builders)
    - model rocketry
    - electronics (workshop|lab|club)
  records:
    - (vinyl|record|records|cd|music|lp) (fair|show|swap|sale|expo|convention|collecting)s?
    - record (store|shop) day
    - vinyl (collect\w*|records?|night|listening)
    - listening (party|session)
    - (book|books|paper|ephemera|postcard|comic|comics|map) (fair|show|swap|expo)s?
    - (antiquarian|rare) books?
    - ephemera
    - comic ?cons?
    - (stamp|coin|postcard|toy|vintage toy) (show|fair|club|collectors?)s?
    - collectors'? (show|fair|expo)
  outdoors:
    - (bird|birding) (walk|watch|count|trip|hike|tour)\w*
    - birding
    - birdwatching
    - audubon
    - (nature|guided|seal|beach|night|owl|moonlight|full moon|history|historic|forest|winter) (walk|hike|prowl|stroll)s?
    - (geology|geologic|rock|mineral|fossil|gem) (walk|hunt|show|sale|club|talk|program)s?
    - geology
    - minerals?
    - fossils?
    - metal detect\w*
    - treasure hunt\w*
    - beachcomb\w*
    - lighthouse (tours?|open house|climb|visit)
    - lighthouses
    - (walking|boat|harbor|historic|ghost|lantern|behind[- ]the[- ]scenes|guided|garden|estate|mansion|bay|eco) tours?
    - (boat|ferry|harbor|seal|whale|eco) (cruise|trip|excursion|watch)\w*
    - excursions?
    - seal (watch|walk)\w*
    - naturalist
    - preserve walk
  fairs:
    - farmers'? markets?
    - (renaissance|medieval|ren) (faire|fair|festival)s?
    - ren ?faire
    - (flea|antique|antiques|vintage) (market|fair|show)s?
    - (steampunk|pirate|viking|highland) (festival|fair|faire)s?
  museum:
    - planetarium
    - astronomy
    - telescopes?
    - star party
    - space (shuttle|flight|exploration|history)
    - aviation history
    - aircraft
    - tesla
    - science (museum|center)
    # Government and lab open houses, only when about science or tech.
    - (lab|laboratory|observatory|weather service|NOAA|coast guard|air (national )?guard|air station|power plant|water (treatment|pollution control)|radio station|fire ?boat) (open house|tours?|day)
    - open house at (the )?(lab|laboratory|observatory|weather|NOAA|coast guard|air station|planetarium)
    - Brookhaven (National )?Lab\w*
    - BNL
    - summer sundays
    - (aviation|air) (show|day)s?

# These categories use everyday words ("tour", "3D printing", "market"), so
# they only count when they appear in the event title, not the description.
title_only: [makers, records, outdoors, fairs]

# Matching titles are dropped even if they matched above: kids' crafts,
# day trips, classes for beginners, and other false friends.
exclude:
  - grades?
  - gr\.? ?\d\w*
  - kids
  - children'?s
  - family
  - (dog|pet)s?
  - tweens?
  - teens?
  - toddlers?
  - preschool
  - storytime
  - months
  - craft
  - (bus|day) trip
  - trip to
  - book club
  - underground railroad
  - computer (basics|classes|class|cleanup)
  - beginners?
  - board games?
  - closed
  - little learners
  - storytime\W.*
  - bingo
