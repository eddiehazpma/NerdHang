# Every place NerdHang pulls events from.
# To add a source, copy an entry and change it. Fields:
#   id:        short unique name (letters, numbers, dashes)
#   name:      shown on the site
#   type:      "ics" (a calendar feed URL). More types will be added.
#   url:       the feed address
#   category:  trains | ham-radio | computers | museum, or "auto" to pick
#              from collector/keywords.yaml
#   filter:    "keywords" keeps only events matching collector/keywords.yaml
#              (use for libraries, towns and news calendars)
#   homepage:  link shown next to events from this source
#   default_location: used when an event has no usable location
#   always_default_location: ignore the feed's LOCATION (e.g. room names)
#   location_hints: if an event title contains the key, use that place
#   exclude_titles: optional pattern; events whose title matches are skipped
#   enabled:   set to false to pause a source without deleting it

sources:
  - id: rmli
    name: Railroad Museum of Long Island
    type: ics
    url: https://www.rmli.org/events/?ical=1
    category: trains
    homepage: https://www.rmli.org/
    default_location:
      name: Railroad Museum of Long Island
      address: 416 Griffing Ave, Riverhead, NY 11901
    location_hints:
      Greenport: { name: RMLI Greenport, address: "440 Fourth St, Greenport, NY 11944" }
      Sayville: { name: Sayville, address: "Sayville, NY" }
    enabled: true

  - id: tca
    name: Train Collectors Association
    type: ics
    url: https://www.tcatrains.org/events/list/?ical=1
    category: trains
    homepage: https://www.tcatrains.org/
    enabled: true

  - id: eastern-tca
    name: TCA Eastern Division (York Train Fair)
    type: ics
    url: https://easterntca.com/future-meet-dates/?ical=1
    category: trains
    homepage: https://easterntca.com/
    title_prefix: "York Train Meet: "
    enabled: true

  - id: limarc
    name: Long Island Mobile Amateur Radio Club
    type: ics
    url: https://calendar.google.com/calendar/ical/limarc.org_as01tkgc77ij7p3n1urrct7348%40group.calendar.google.com/public/basic.ics
    category: ham-radio
    homepage: https://limarc.org/
    # Skip on-air nets and business meetings; keep hamfests, swap meets, talks.
    exclude_titles: '\bnets?\b|check-?in|info ne\b|swap-n-shop|board\s+[mn]eeting|ARES meeting'
    default_location:
      name: LIMARC
      address: Hicksville, NY
    enabled: true

  # ---- General community calendars: only keyword matches are kept ----

  - id: li-press
    name: Long Island Press events
    type: ics
    url: https://events.longislandpress.com/?ical=1
    category: auto
    filter: keywords
    homepage: https://events.longislandpress.com/
    enabled: true

  - id: cradle-of-aviation
    name: Cradle of Aviation Museum
    type: ics_links
    url: https://www.cradleofaviation.org/plan_your_visit/event_calendar.html
    link_pattern: 'href="([^"]*/event_calendar\.html/ical/[^"]+)"'
    max_links: 40
    category: museum
    homepage: https://www.cradleofaviation.org/
    always_default_location: true
    default_location:
      name: Cradle of Aviation Museum
      address: "Charles Lindbergh Blvd, Garden City, NY 11530"
    enabled: true

