  # Daily area searches: each topic + area is searched (Brave Search API),
  # and result pages with schema.org Event data become events. Needs the
  # BRAVE_SEARCH_API_KEY repository secret; skipped without it.
  - id: search
    name: Web search
    type: search
    category: auto
    filter: keywords
    areas: ["Long Island NY"]
    topics:
      - train show
      - model train display
      - hamfest
      - vintage computer show
      - retro gaming expo
      - maker faire
      - record fair
      - antiquarian book fair
      - book and paper fair
      - ephemera show
      - postcard show
      - mineral show
      - renaissance faire
      - lighthouse tour
      - bird walk
    max_pages: 60
    # Sites that block robots, forbid copying listings, or are social media.
    skip_domains: 'facebook\.com|instagram\.com|x\.com|twitter\.com|tiktok\.com|youtube\.com|reddit\.com|eventbrite\.|arrl\.org|yelp\.com|tripadvisor\.'
    enabled: true

  # The NerdHang inbox: newsletters and calendar invites sent to the project's
  # Gmail address. Needs repository secrets NERDHANG_EMAIL and
  # NERDHANG_APP_PASSWORD; skipped without them. Add a newsletter under
  # `senders` to give its events a name and a default location.
  - id: inbox
    name: NerdHang inbox
    type: email
    days_back: 60
    category: auto
    senders:
      - match: nonsensenyc
        name: Nonsense NYC
        default_location: { name: "New York City", address: "New York, NY" }
    enabled: true

  - id: manual
    name: NerdHang picks
    type: manual
    path: collector/manual_events.yaml
    enabled: true
