name: Probe feeds (temporary)
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m collector.build || true
      - run: |
          python - <<'PY'
          import json, collections
          ev = json.load(open("data/events.json"))
          evs = ev["events"] if isinstance(ev, dict) else ev
          print("TOTAL", len(evs))
          print(collections.Counter(e["source_id"] for e in evs))
          print(collections.Counter(e["category"] for e in evs))
          for e in sorted(evs, key=lambda e: e["category"]):
              if e["category"] in ("makers","records","outdoors","fairs") or e["source_id"] in ("sofo","vanderbilt","li-museum","old-westbury-gardens","planting-fields"):
                  print(e["start"][:10], e["category"], e["source_id"], "|", e["title"])
          PY
