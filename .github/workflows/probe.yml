name: Probe feeds (temporary)
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env:
          NERDHANG_EMAIL: ${{ secrets.NERDHANG_EMAIL }}
          NERDHANG_APP_PASSWORD: ${{ secrets.NERDHANG_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import email, collector.fetch_email as fe
          from email import policy
          from datetime import date, timedelta
          import os
          print("secrets present:", bool(os.environ.get("NERDHANG_EMAIL")), bool(os.environ.get("NERDHANG_APP_PASSWORD")))
          user, pw = os.environ["NERDHANG_EMAIL"], os.environ["NERDHANG_APP_PASSWORD"].replace(" ", "")
          msgs = fe._imap_messages(user, pw, 60, 300)
          print("login ok; messages in last 60 days:", len(msgs))
          for raw in msgs:
              m = email.message_from_bytes(raw, policy=policy.default)
              print("  from domain:", (m.get("From") or "").split("@")[-1].strip("> "))
          import yaml
          src = next(s for s in yaml.safe_load(open("collector/sources.yaml"))["sources"] if s["id"] == "inbox")
          evs = fe.fetch_email(src, date.today() - timedelta(days=1), date.today() + timedelta(days=548), fetch_messages=lambda: msgs)
          print("events found:", len(evs))
          for e in evs: print("  ", e.start, e.category, "|", e.title, "|", e.location.address)
          PY
