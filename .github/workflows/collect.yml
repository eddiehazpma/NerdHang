name: Collect events

on:
  schedule:
    - cron: "17 10 * * *"   # every day, about 5 AM New York time
  workflow_dispatch: {}      # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: ["collector/**", "site/**", ".github/workflows/collect.yml"]
  pull_request:
    paths: ["collector/**", "tests/**", "site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-events
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Collect events
        if: github.event_name != 'pull_request'
        run: python -m collector.build
      - name: Save updated data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "nerdhang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update events $(date -u +%Y-%m-%d)"
            git push
          fi

  # Publishes the website (site/ plus the fresh data) to GitHub Pages.
  # GitHub Pages is free for public repositories, so this runs only when the
  # repository is public. Pages must be set to "GitHub Actions" in
  # Settings > Pages.
  deploy:
    needs: collect
    if: github.event_name != 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # includes the data commit made by the collect job
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp data/events.json data/nerdhang.ics _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
